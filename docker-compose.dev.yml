version: '3.8'

services:
  postgres:
    image: postgres:12.2-alpine
    container_name: dev-postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - ./data/dev/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      dev-net:
        ipv4_address: 172.24.0.49

  nakama:
    image: jphyun2019/wildfire-nakama:dev
    container_name: dev-nakama
    depends_on:
      - postgres
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    ports:
      - "7360:7350"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7350/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      dev-net:
        ipv4_address: 172.24.0.50

  algorithm:
    image: jphyun2019/wildfire-algorithm:dev
    container_name: dev-algorithm
    depends_on:
      - nakama
    runtime: nvidia
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TMPDIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - DISPLAY=:0
    volumes:
      - ./data/dev/results:/app/crew-algorithms/crew_algorithms/wildfire_alg/results
      - ./data/dev/tmp:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    networks:
      dev-net:
        ipv4_address: 172.24.0.100

  backend:
    image: jphyun2019/wildfire-backend:dev
    container_name: dev-backend
    depends_on:
      - algorithm
    environment:
      - PYTHONPATH=/app
      - ALGORITHM_SERVICE_URL=http://algorithm:8001
    ports:
      - "8080:8000"
    volumes:
      - ./data/dev/tmp:/tmp
    restart: unless-stopped
    networks:
      - dev-net

  frontend:
    image: jphyun2019/wildfire-frontend:dev
    container_name: dev-frontend
    depends_on:
      - backend
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.1
