version: '3.8'

services:
  postgres:
    image: postgres:12.2-alpine
    container_name: wildfire-postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      wildfire-net:
        ipv4_address: 172.23.0.49

  nakama:
    image: jzr90/wildfire-nakama@sha256:df729c682787d79980c3a3fe636a3000b844271ac292a0a1775f5299e20990e9
    container_name: wildfire-nakama
    depends_on:
      - postgres
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama
    expose:
      - "7349"
      - "7350"
      - "7351"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7350/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      wildfire-net:
        ipv4_address: 172.23.0.50

  algorithm:
    image: jzr90/wildfire-algorithm@sha256:d43513bafd45f38b876f2b45dce890903cbc118c554f794979d4f284524f3375
    container_name: wildfire-algorithm
    depends_on:
      - nakama
    runtime: nvidia
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TMPDIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - DISPLAY=:0
    expose:
      - "8001"
    volumes:
      - ./data/results:/app/crew-algorithms/crew_algorithms/wildfire_alg/results
      - ./data/tmp:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    restart: unless-stopped
    networks:
      wildfire-net:
        ipv4_address: 172.23.0.100

  backend:
    image: jzr90/wildfire-backend@sha256:4eba98f6e5772907b426e0eafa5eec3530e8f4bbfcb873a23e796ddc1502bf7b
    container_name: wildfire-backend
    depends_on:
      - algorithm
    environment:
      - PYTHONPATH=/app
      - ALGORITHM_SERVICE_URL=http://algorithm:8001
    expose:
      - "8000"
    volumes:
      - ./data/tmp:/tmp
    restart: unless-stopped
    networks:
      - wildfire-net

  frontend:
    image: jzr90/wildfire-frontend@sha256:0517184ebdabff0a7c9d2524054090f4932b52ec9066ebf289f1794ddddb532d
    container_name: wildfire-frontend
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - wildfire-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    container_name: wildfire-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - nakama
    networks:
      - wildfire-net
    restart: unless-stopped

networks:
  wildfire-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1

volumes:
  caddy_data:
  caddy_config:
